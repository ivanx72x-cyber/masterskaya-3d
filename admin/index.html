<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление товарами</title><style>*{box-sizing:border-box}body{margin:0;background:#101112;color:#f4f3ef;font:16px system-ui;padding:18px}.wrap{max-width:720px;margin:auto}.panel{background:#191b1d;border:1px solid #303336;border-radius:14px;padding:16px;margin:14px 0}label{display:block;margin:12px 0 5px;color:#c8c9c9}input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #45494c;background:#101112;color:white;font:inherit}input[type=checkbox]{width:auto}button{padding:12px 15px;border:0;border-radius:9px;background:#ff7838;color:#171717;font-weight:700;margin:8px 6px 0 0}.muted{color:#aaa;font-size:14px}.item{border-bottom:1px solid #383838;padding:12px 0}.hidden{display:none}.status{white-space:pre-wrap;margin-top:12px}</style></head><body><main class="wrap"><h1>Управление товарами</h1><p class="muted">Добавление товаров и фотографий в каталог.</p><section class="panel" id="login"><label>Пароль администратора</label><input id="pw" type="password" autocomplete="current-password"><button id="enter">Войти</button><div id="loginMsg" class="status"></div></section><section class="panel hidden" id="app"><div style="display:flex;justify-content:space-between"><h2>Каталог</h2><button id="exit">Выйти</button></div><div id="items"></div><h2 id="heading">Новый товар</h2><input id="pid" type="hidden"><label>Название</label><input id="name"><label>Категория</label><input id="cat"><label>Цена, ₽</label><input id="price" type="number" min="0" value="0"><label>Описание</label><textarea id="desc" rows="3"></textarea><label><input id="request" type="checkbox"> Цена по запросу</label><label>Фотография (JPG, PNG или WebP, до 4 МБ)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="save">Сохранить товар</button><button id="reset">Очистить</button><div id="msg" class="status"></div></section></main><script>
const $=x=>document.getElementById(x);let pw='',items=[];
async function call(data){let r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){$('items').innerHTML=items.map((p,i)=>'<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.cat)+' · '+(p.price_on_request?'Цена по запросу':p.price+' ₽')+'</div><button data-edit="'+i+'">Изменить</button><button data-del="'+i+'">Удалить</button></div>').join('')}
function clear(){['pid','name','cat','desc'].forEach(x=>$(x).value='');$('price').value=0;$('request').checked=false;$('photo').value='';$('heading').textContent='Новый товар'}
$('enter').onclick=async()=>{pw=$('pw').value;try{items=(await call({action:'load'})).items;$('login').classList.add('hidden');$('app').classList.remove('hidden');draw()}catch(e){$('loginMsg').textContent=e.message;pw=''}}
$('exit').onclick=()=>{pw='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').value=''};
$('reset').onclick=clear;
$('items').onclick=e=>{let i=e.target.dataset.edit,d=e.target.dataset.del;if(i!==undefined){let p=items[+i];$('pid').value=p.id;$('name').value=p.name;$('cat').value=p.cat;$('price').value=p.price||0;$('desc').value=p.desc||'';$('request').checked=!!p.price_on_request;$('heading').textContent='Изменить товар'}if(d!==undefined&&confirm('Удалить товар?')){items.splice(+d,1);save()}}
async function save(){ $('msg').textContent='Сохраняю…';try{await call({action:'save',items});draw();$('msg').textContent='Каталог сохранён. Публикация начнётся автоматически.'}catch(e){$('msg').textContent=e.message}}
$('save').onclick=async()=>{let name=$('name').value.trim();if(!name){$('msg').textContent='Укажи название товара.';return}let p={id:$('pid').value||Date.now(),name,cat:$('cat').value.trim()||'Без категории',price:Number($('price').value)||0,price_on_request:$('request').checked,desc:$('desc').value.trim(),icon:'🧩'};try{let f=$('photo').files[0];if(f){if(f.size>4*1024*1024)throw Error('Фото больше 4 МБ');if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Неподдерживаемый формат');let b=await new Promise((ok,no)=>{let x=new FileReader();x.onload=()=>ok(x.result.split(',')[1]);x.onerror=no;x.readAsDataURL(f)});let up=await call({action:'upload',filename:f.name,mime:f.type,data:b});p.image=up.url}else{let old=items.find(x=>String(x.id)===String(p.id));if(old?.image)p.image=old.image}let i=items.findIndex(x=>String(x.id)===String(p.id));if(i<0)items.push(p);else items[i]=p;await save();clear()}catch(e){$('msg').textContent='Ошибка: '+e.message}}
</script></body></html>
